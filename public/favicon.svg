<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E5BD8"/>
      <stop offset="1" stop-color="#0B2A5B"/>
    </linearGradient>
    <linearGradient id="day" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
    <clipPath id="face"><circle cx="512" cy="512" r="300"/></clipPath>
    <mask id="moon">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="418" cy="388" r="50" fill="#000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="334" fill="none" stroke="#fff" stroke-width="34"/>
  <g clip-path="url(#face)">
    <rect x="212" y="212" width="300" height="600" fill="#102F66"/>
    <rect x="512" y="212" width="300" height="600" fill="url(#day)"/>
  </g>
  <!-- lua -->
  <circle cx="390" cy="400" r="58" fill="#FFF3D6" mask="url(#moon)"/>
  <circle cx="330" cy="560" r="7" fill="#FFF3D6"/>
  <circle cx="440" cy="640" r="5" fill="#FFF3D6"/>
  <circle cx="345" cy="330" r="5" fill="#FFF3D6"/>
  <!-- sol -->
  <circle cx="640" cy="400" r="52" fill="#FFF3D6"/>
  <!-- ponteiros -->
  <g stroke="#fff" stroke-linecap="round" fill="none">
    <line x1="512" y1="512" x2="512" y2="285" stroke-width="30"/>
    <line x1="512" y1="512" x2="626" y2="578" stroke-width="30"/>
  </g>
  <circle cx="512" cy="512" r="26" fill="#fff"/>
  <circle cx="512" cy="512" r="10" fill="#0B2A5B"/>
</svg>
